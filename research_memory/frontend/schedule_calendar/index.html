<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
    </style>
    <style id="dyn"></style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
          "*"
        );
      }

      function setHeight() {
        const h = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          560
        );
        send("streamlit:setFrameHeight", { height: h });
      }

      function bind() {
        document.querySelectorAll("[data-sched-date]").forEach(function (el) {
          el.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            send("streamlit:setComponentValue", {
              value: {
                date: el.getAttribute("data-sched-date") || "",
                item: el.getAttribute("data-sched-item") || "",
                t: Date.now(),
              },
              dataType: "json",
            });
          });
        });
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        document.getElementById("dyn").textContent = args.css || "";
        document.getElementById("root").innerHTML = args.html || "";
        bind();
        requestAnimationFrame(setHeight);
        setTimeout(setHeight, 80);
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight();
    </script>
  </body>
</html>
