<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
    </style>
    <style id="dyn"></style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
          "*"
        );
      }

      function setHeight() {
        const h = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          560
        );
        send("streamlit:setFrameHeight", { height: h });
      }

      function sendValue(value) {
        send("streamlit:setComponentValue", { value: value, dataType: "json" });
      }

      document.getElementById("root").addEventListener(
        "click",
        function (event) {
          const chip = event.target.closest(".rm-cal-html-chip");
          if (chip) {
            event.preventDefault();
            event.stopPropagation();
            sendValue({
              date: chip.getAttribute("data-sched-date") || "",
              item: chip.getAttribute("data-sched-item") || "",
              t: Date.now(),
            });
            return;
          }
          const cell = event.target.closest(".rm-cal-html-cell");
          if (!cell) return;
          event.preventDefault();
          event.stopPropagation();
          sendValue({
            date: cell.getAttribute("data-sched-date") || "",
            item: "",
            t: Date.now(),
          });
        },
        true
      );

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        document.getElementById("dyn").textContent = args.css || "";
        document.getElementById("root").innerHTML = args.html || "";
        requestAnimationFrame(setHeight);
        setTimeout(setHeight, 80);
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight();
    </script>
  </body>
</html>
